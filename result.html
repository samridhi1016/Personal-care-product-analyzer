<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Result - {{ product_name }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('public', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>{{ product_name }}</h1>

        <div class="score-box {{ result.grade_color }}">
            <div class="score-number">{{ result.score }}/100</div>
            <div class="score-grade">{{ result.grade }}</div>
        </div>

        {% if result.flags %}
            {% for flag in result.flags %}
            <div class="flag {{ flag.severity }}">
                <div class="flag-type">{{ flag.severity }}</div>
                {{ flag.message }}
            </div>
            {% endfor %}
        {% else %}
            <div class="no-flags">None of the ingredients you entered were found in our local reference database.</div>
        {% endif %}

        <a class="back-link" href="/">&larr; Analyze another product</a>
    </div>
</body>
</html>
